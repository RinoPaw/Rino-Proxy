name: Go CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve dependencies
        run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Cross-compile Windows AMD64
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/rino.exe ./cmd/rino
      - name: Cross-compile Linux ARM64
        run: GOOS=linux GOARCH=arm64 go build -o /tmp/rino-arm64 ./cmd/rino
